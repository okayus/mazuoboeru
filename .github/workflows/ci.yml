# test/lint/typecheck のみ。デプロイは Workers Builds（Cloudflare 側）が担う＝
# このリポの Actions に Cloudflare の secret は存在しない（docs/adr/0003-secrets-strategy.md）。
# main の ruleset はこのワークフローの job 名 `ci` を required check に指定する。
# この yaml は「安定シェル」— steps はリポ内ファイル（package.json の `ci` script / .node-version）を
# 呼ぶだけにし、CI の中身の変更は workflow yaml を触らずにサンドボックスから行う（token に
# `workflows` 権限は無い）。action の更新（SHA pin）は Dependabot が PR を出す。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 — `version:` は書かない（package.json の packageManager を読む）
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version # node24: host/sandbox/CI を統一（ADR-0005）
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, format check, build, test
        run: pnpm run ci
